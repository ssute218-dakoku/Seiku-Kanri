<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>十勝 農作業ダッシュボード</title>
<style>
:root{--bg:#eef3ee;--card:rgba(255,255,255,.72);--tx:#16251a;--sub:#5a6b5e;--ac:#2f7d4f;--warn:#c2410c;--ok:#15803d;--line:rgba(0,0,0,.1);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1611;--card:rgba(30,44,35,.7);--tx:#e6f0e8;--sub:#9db0a2;--ac:#5fc287;--warn:#fb923c;--ok:#4ade80;--line:rgba(255,255,255,.12);color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(160deg,var(--bg),#cfe3d3 160%);background-attachment:fixed;color:var(--tx);font:15px/1.55 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding:max(12px,env(safe-area-inset-top)) 12px max(24px,env(safe-area-inset-bottom))}
main{max-width:720px;margin:auto;display:grid;gap:12px}
h1{font-size:19px;margin:6px 4px 0}h2{font-size:15px;margin:0 0 8px}
.card{background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;padding:14px}
.sub{color:var(--sub);font-size:12.5px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kpi{flex:1;min-width:90px;text-align:center}.kpi b{display:block;font-size:20px}
.hours{display:flex;gap:6px;overflow-x:auto;padding:6px 0}
.h{min-width:54px;text-align:center;font-size:12px;border:1px solid var(--line);border-radius:10px;padding:6px 2px}
.h i{font-style:normal;font-size:18px;display:block}
input,select,button{font:inherit;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--tx)}
button{background:var(--ac);color:#fff;border:0;cursor:pointer}button.g{background:transparent;color:var(--sub);border:1px solid var(--line);padding:4px 9px;font-size:12px}
a{color:var(--ac)}
.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden;margin:6px 0}.bar div{height:100%;background:var(--ac)}
.tag{display:inline-block;font-size:11.5px;border-radius:6px;padding:1px 7px;color:#fff;margin-right:4px}.t1{background:#2563eb}.t2{background:#c2410c}
.ev{padding:6px 0;border-top:1px dashed var(--line)}.now{background:rgba(251,146,60,.14);border-radius:8px;padding:6px}
.moon{font-size:42px;line-height:1}.ok{color:var(--ok)}.warn{color:var(--warn)}
</style>
</head>
<body>
<main>
<h1>🌾 十勝 農作業ダッシュボード <span class="sub" id="today"></span></h1>

<section class="card" id="wx"><h2>現在地の天気（今後24時間）</h2><div class="sub">位置情報を取得中…</div></section>

<section class="card"><h2>月齢</h2><div class="row"><div class="moon" id="mi"></div><div id="mt"></div></div></section>

<section class="card">
<h2>作物と播種日</h2>
<div class="row">
<select id="cs"></select>
<input type="date" id="cd">
<input id="cl" placeholder="圃場名（任意）" style="flex:1;min-width:110px">
<button id="add">追加</button>
</div>
<div class="sub" style="margin-top:6px">てんさいは移植日、ながいもは植付日、秋まき小麦は播種日を入力します。</div>
</section>

<div id="list" style="display:grid;gap:12px"></div>

<section class="card sub">
<h2 style="color:var(--tx)">ご利用上の注意</h2>
生育ステージと作業時期は、十勝地域の一般的な栽培体系に基づく<b>日数の目安</b>です。実際の判断は、圃場の観察、北海道施肥ガイド、北海道農作物病害虫・雑草防除ガイド、JA・普及センターの最新情報で必ず確認してください。農薬は登録内容（作物・使用時期・回数）と散布履歴を確認のうえ使用してください。ステージ表は下部の <code>CROPS</code> で編集できます。
</section>
</main>

<script>
// ===== 作物ステージ表（日数は播種/植付/移植日からの目安。要:一次資料での照合） =====
const CROPS={
 sm:{n:'ばれいしょ スノーマーチ',end:140,
  st:[[0,'植付〜出芽前'],[25,'出芽期'],[40,'培土期'],[55,'開花期'],[80,'塊茎肥大期'],[115,'茎葉黄変期'],[135,'収穫適期']],
  ev:[[38,1,'培土前後の追肥：基肥で足りる場合が多い。草勢が弱い場合のみ少量の窒素を検討'],
      [45,2,'疫病 予防散布を開始（初発前、7〜10日間隔、FRAC系統をローテーション）'],
      [60,2,'疫病・夏疫病 継続散布（降雨前後を優先）'],
      [75,2,'疫病 継続散布。アブラムシ（ウイルス媒介）の発生も確認'],
      [105,2,'疫病 最終散布（収穫前日数を確認）']]},
 mq:{n:'ばれいしょ メークイン',end:125,
  st:[[0,'植付〜出芽前'],[22,'出芽期'],[35,'培土期'],[48,'開花期'],[70,'塊茎肥大期'],[100,'茎葉黄変期'],[118,'収穫適期']],
  ev:[[33,1,'培土前後の追肥：草勢が弱い場合のみ少量の窒素を検討'],
      [40,2,'疫病 予防散布を開始（初発前、7〜10日間隔）'],
      [55,2,'疫病・夏疫病 継続散布'],
      [70,2,'疫病 継続散布。アブラムシの発生も確認'],
      [95,2,'疫病 最終散布（収穫前日数を確認）']]},
 wh:{n:'秋まき小麦 きたほなみ',end:305,
  st:[[0,'播種〜出芽'],[20,'分げつ期'],[60,'越冬（根雪）'],[205,'起生期'],[225,'幼穂形成期'],[250,'止葉期'],[261,'出穂期'],[265,'開花期'],[283,'乳熟〜糊熟期'],[300,'成熟期・収穫']],
  ev:[[55,2,'雪腐病 防除（根雪前）'],
      [205,1,'春の追肥①（起生期。融雪日で前後するため圃場の茎数を確認）'],
      [225,1,'春の追肥②（幼穂形成期。茎数・穂数の確保）'],
      [258,2,'うどんこ病・葉の病害 発生状況に応じ防除'],
      [263,1,'開花期前後の追肥（子実タンパク確保。必要時のみ）'],
      [265,2,'赤かび病 防除①（開花始め）'],
      [275,2,'赤かび病 防除②（①から約10日後）']]},
 sb:{n:'てんさい（移植）',end:170,
  st:[[0,'活着期'],[14,'初期生育'],[45,'葉面積拡大期'],[70,'根部肥大盛期'],[120,'糖分蓄積期'],[160,'収穫期']],
  ev:[[10,2,'初期除草（雑草の発生状況を見て体系処理）'],
      [25,2,'2回目除草・ヨトウ／ネキリムシ類の確認'],
      [30,1,'追肥は基本不要（窒素過多は根中糖分の低下要因）。葉色が極端に淡い場合のみ検討'],
      [65,2,'褐斑病 初発確認と防除開始（発生初期）'],
      [80,2,'褐斑病 2回目（10〜14日間隔）'],
      [95,2,'褐斑病 3回目（発病状況に応じ）']]},
 ny:{n:'ながいも',end:195,
  st:[[0,'植付〜萌芽前'],[28,'萌芽期'],[45,'つる伸長期'],[90,'いも肥大始期'],[140,'肥大盛期'],[175,'茎葉黄変期'],[190,'収穫期']],
  ev:[[40,0,'支柱・ネットの誘引と管理'],
      [60,1,'追肥①（つる伸長期）'],
      [70,2,'褐斑病・炭疽病など 初発防除'],
      [100,1,'追肥② 肥大期（窒素は控えめ、加里を意識）'],
      [100,2,'茎葉病害 継続防除（降雨が続く場合は間隔短縮）']]}
};
// =====================================================================================
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAY=864e5,jst=()=>new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Tokyo'}));
let crops=[],daily={},coords=null;
try{crops=JSON.parse(localStorage.getItem('farm-crops')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('farm-crops',JSON.stringify(crops))}catch(e){}};
const t0=jst();$('#today').textContent=t0.getFullYear()+'/'+(t0.getMonth()+1)+'/'+t0.getDate();
$('#cs').innerHTML=Object.entries(CROPS).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('');
$('#cd').value=t0.toISOString().slice(0,10).replace(/.*/,()=>{const d=t0;return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')});

// ===== 月齢 =====
function moon(){const jd=Date.now()/864e5+2440587.5,S=29.530588853;let a=((jd-2451550.1)%S+S)%S;
 const i=Math.round(a/S*8)%8,em='🌑🌒🌓🌔🌕🌖🌗🌘'[i]||'🌑',nm=['新月','三日月','上弦','十三夜前後','満月','十八夜前後','下弦','有明月'][i];
 const f=(1-Math.cos(2*Math.PI*a/S))/2;
 $('#mi').textContent=em;
 $('#mt').innerHTML=`<b style="font-size:19px">月齢 ${a.toFixed(1)}</b> <span class="sub">${nm}</span><div class="sub">輝面比 約${Math.round(f*100)}%　次の満月まで 約${Math.round(((14.77-a)+S)%S)}日／新月まで 約${Math.round(S-a)}日</div>`}
moon();

// ===== 天気 =====
const wc=c=>c===0?['☀️','晴']:c<=3?['⛅','曇']:c<=48?['🌫️','霧']:c<=57?['🌦️','霧雨']:c<=67?['🌧️','雨']:c<=77?['🌨️','雪']:c<=82?['🌦️','にわか雨']:['⛈️','雷雨'];
function locate(){
 const go=(la,lo,note)=>{coords={la,lo};try{localStorage.setItem('farm-pos',JSON.stringify(coords))}catch(e){}weather(note)};
 let last=null;try{last=JSON.parse(localStorage.getItem('farm-pos'))}catch(e){}
 if(!navigator.geolocation)return go(last?last.la:42.92,last?last.lo:143.2,last?'前回の位置':'位置情報が使えないため帯広付近');
 navigator.geolocation.getCurrentPosition(p=>go(p.coords.latitude,p.coords.longitude,'現在地'),
  ()=>go(last?last.la:42.92,last?last.lo:143.2,last?'前回の位置（取得失敗）':'位置情報が許可されていないため帯広付近'),{timeout:8000,maximumAge:6e5});
}
async function weather(note){
 const {la,lo}=coords,b='https://api.open-meteo.com/v1/forecast?latitude='+la.toFixed(4)+'&longitude='+lo.toFixed(4)+'&wind_speed_unit=ms&timezone=Asia%2FTokyo';
 try{
  const [h,d]=await Promise.all([fetch(b+'&hourly=temperature_2m,precipitation,wind_speed_10m,weather_code&forecast_days=3').then(r=>r.json()),
   fetch(b+'&daily=temperature_2m_mean&past_days=92&forecast_days=1').then(r=>r.json())]);
  d.daily.time.forEach((t,i)=>daily[t]=d.daily.temperature_2m_mean[i]);
  const nowS=new Date().toLocaleString('sv-SE',{timeZone:'Asia/Tokyo'}).slice(0,13);
  let s=h.hourly.time.findIndex(t=>t.replace('T',' ').slice(0,13)>=nowS);if(s<0)s=0;
  const idx=[...Array(24).keys()].map(i=>s+i),T=idx.map(i=>h.hourly.temperature_2m[i]),W=idx.map(i=>h.hourly.wind_speed_10m[i]),P=idx.map(i=>h.hourly.precipitation[i]);
  const n6=idx.slice(0,6),w6=Math.max(...n6.map(i=>h.hourly.wind_speed_10m[i])),p6=n6.reduce((a,i)=>a+h.hourly.precipitation[i],0);
  const sp=(w6<=3&&p6<0.1)?['〇 散布向き','ok']:(w6<=5&&p6<1)?['△ 注意（風・雨）','warn']:['× 散布不向き','warn'];
  const mn=Math.min(...T),mx=Math.max(...T);
  $('#wx').innerHTML=`<h2>現在地の天気（今後24時間）</h2><div class="sub">${note}（${la.toFixed(3)}, ${lo.toFixed(3)}）／気象予測モデル：Open-Meteo</div>
  <div class="row" style="margin:8px 0"><div class="kpi"><span class="sub">気温</span><b>${mn.toFixed(0)}〜${mx.toFixed(0)}℃</b></div><div class="kpi"><span class="sub">最大風速</span><b>${Math.max(...W).toFixed(1)} m/s</b></div><div class="kpi"><span class="sub">降水量</span><b>${P.reduce((a,b)=>a+b,0).toFixed(1)} mm</b></div></div>
  <div class="${sp[1]}"><b>防除散布（今後6時間）：${sp[0]}</b> <span class="sub">風速${w6.toFixed(1)}m/s・降水${p6.toFixed(1)}mm</span></div>
  ${mn<=2?'<div class="warn"><b>❄️ 低温・霜への注意（最低'+mn.toFixed(1)+'℃）</b></div>':''}
  <div class="hours">${idx.map(i=>{const x=wc(h.hourly.weather_code[i]);return `<div class="h">${h.hourly.time[i].slice(11,13)}時<i>${x[0]}</i>${h.hourly.temperature_2m[i].toFixed(0)}℃<br>${h.hourly.wind_speed_10m[i].toFixed(1)}m/s</div>`}).join('')}</div>
  <a href="https://weathernews.jp/onebox/${la.toFixed(6)}/${lo.toFixed(6)}/" target="_blank" rel="noopener">ウェザーニュースで同地点を開く ↗</a>`;
 }catch(e){$('#wx').innerHTML='<h2>現在地の天気</h2><div class="warn">天気を取得できませんでした。通信状況を確認してください。</div>'}
 render();
}

// ===== 作物表示 =====
function render(){
 const today=new Date(t0.getFullYear(),t0.getMonth(),t0.getDate());
 $('#list').innerHTML=crops.map((c,k)=>{
  const def=CROPS[c.k],sow=new Date(c.d+'T00:00:00'),das=Math.floor((today-sow)/DAY);
  if(das<0)return card(c,k,def,`播種前（あと${-das}日）`,0,'<div class="sub">播種日以降に生育状況を表示します。</div>',das);
  let si=0;def.st.forEach((s,i)=>{if(das>=s[0])si=i});
  const st=def.st[si],nx=def.st[si+1],pr=Math.min(100,das/def.end*100);
  let ts='';if(das<=92){let sum=0,ok=0;for(let i=0;i<=das;i++){const t=new Date(sow.getTime()+i*DAY),k2=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');if(daily[k2]!=null){sum+=Math.max(0,daily[k2]);ok++}}if(ok)ts=`／積算気温 ${Math.round(sum)}℃・日`}
  const evs=def.ev.map(e=>({d:e[0],t:e[1],x:e[2],dt:new Date(sow.getTime()+e[0]*DAY)})).filter(e=>e.d>=das-3).slice(0,4);
  const html=`<div class="sub">${nx?`次：${nx[1]}（あと約${nx[0]-das}日・${fmt(new Date(sow.getTime()+nx[0]*DAY))}頃）`:'最終ステージ'}${ts}</div>
  <div style="margin-top:8px"><b>推奨される作業</b></div>
  ${evs.length?evs.map(e=>{const cur=e.d-das<=7;return `<div class="ev ${cur?'now':''}"><span class="tag t${e.t||1}" style="${e.t===0?'background:#64748b':''}">${['管理','追肥','防除'][e.t]}</span><b>${fmt(e.dt)}頃${cur?'（今週前後）':''}</b><br>${e.x}</div>`}).join(''):'<div class="sub">残りの定期作業はありません。収穫適期・収穫前日数を確認してください。</div>'}`;
  return card(c,k,def,`${st[1]}（播種後${das}日）`,pr,html,das)}).join('')||'<div class="card sub">作物と播種日を追加すると、生育状況と推奨作業が表示されます。</div>';
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{crops.splice(+b.dataset.del,1);save();render()});
}
const fmt=d=>(d.getMonth()+1)+'/'+d.getDate();
const card=(c,k,def,title,pr,body)=>`<section class="card"><div class="row" style="justify-content:space-between"><div><b>${def.n}</b> ${c.l?'<span class="sub">'+esc(c.l)+'</span>':''}<div class="sub">播種/植付日 ${c.d}</div></div><button class="g" data-del="${k}">削除</button></div>
 <div style="margin-top:6px;font-size:17px"><b>${title}</b></div><div class="bar"><div style="width:${pr}%"></div></div>${body}</section>`;
$('#add').onclick=()=>{const d=$('#cd').value;if(!d)return;crops.push({k:$('#cs').value,d,l:$('#cl').value.trim()});save();$('#cl').value='';render()};
render();locate();
</script>
</body>
</html>
